<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ thống Điểm danh - Quản lý Lớp học & Khoa</title>
<link rel="stylesheet" href="css/style.css?v=2.5">
</head>
<body>
<header class="topbar">
    <div class="brand-sm">ĐIỂM DANH SINH VIÊN</div>
    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="employees.html">Sinh viên</a>
        <a href="departments.html" class="active">Lớp học / Khoa</a>
        <a href="shifts.html">Ca / Tiết học</a>
        <a href="attendance.html">Điểm danh</a>
    </nav>
    <div class="user">
        <span id="meName">...</span>
        <button id="btnLogout" class="btn btn-ghost">Đăng xuất</button>
    </div>
</header>

<main class="container">
    <div class="page-header">
        <div>
            <h1 style="margin: 0 0 4px 0;">Quản lý Lớp học / Khoa</h1>
            <div class="muted">Danh sách các lớp sinh hoạt, chuyên ngành đào tạo và sĩ số sinh viên</div>
        </div>
        <button id="btnNewDept" class="btn btn-primary">+ Thêm lớp học mới</button>
    </div>

    <div class="card">
        <table class="table" id="deptTable">
            <thead>
                <tr><th>Tên Lớp / Khoa</th><th>Mô tả / Ngành đào tạo</th><th>Sĩ số sinh viên</th><th>Hành động</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</main>

<div id="deptModal" class="modal" style="display: none !important;" aria-hidden="true">
    <div class="modal-card">
        <div class="modal-header">
            <h2 id="deptModalTitle">Thêm Lớp học / Khoa</h2>
            <button type="button" class="btn-close" id="btnCloseDeptModal" title="Đóng">&times;</button>
        </div>
        <form id="deptForm">
            <input type="hidden" name="id" id="deptIdInput">
            <label>Tên Lớp học / Khoa *
                <input name="name" id="deptNameInput" placeholder="VD: Lớp Công nghệ Thông tin K24A" required>
            </label>
            <label>Mô tả / Ngành đào tạo
                <textarea name="description" id="deptDescInput" placeholder="VD: Khóa 24 - Khoa Công nghệ Thông tin ICTU"></textarea>
            </label>
            <div class="modal-actions">
                <button type="button" id="btnCancel" class="btn">Hủy</button>
                <button type="submit" class="btn btn-primary">Lưu lớp học</button>
            </div>
            <p id="deptFormError" class="error" hidden></p>
        </form>
    </div>
</div>

<script src="js/api.js?v=2.6"></script>
<script src="js/departments.js?v=2.6"></script>
</body>
</html>
