version: "3.9"

# ============================================================================
#  De 27: He Thong Diem Danh / Attendance (DTC245160039)
#  Stack: Node.js + Python (AI) + MySQL 8.0 + phpMyAdmin + Nginx
#  All services run as non-root users; isolated via 3 networks.
# ============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    tag: "{{.Name}}"

services:
  # --------------------------------------------------------------------------
  # Database: MySQL 8.0
  # --------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: attendance_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - hrm_backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G

  # --------------------------------------------------------------------------
  # phpMyAdmin
  # --------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: attendance_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: 50M
    networks:
      - hrm_backend
      - hrm_frontend
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M

  # --------------------------------------------------------------------------
  # AI Worker (Python FastAPI + InsightFace + YOLO)
  # --------------------------------------------------------------------------
  ai-worker:
    build: ./ai-worker
    container_name: attendance_ai
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /app
    volumes:
      - ai_uploads:/app/uploads
      - ./ai-worker/yolov8n-face.pt:/app/yolov8n-face.pt:ro
    networks:
      - hrm_backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 3G

  # --------------------------------------------------------------------------
  # Backend (Node.js Express)
  # --------------------------------------------------------------------------
  backend:
    build: ./backend
    container_name: attendance_backend
    restart: unless-stopped
    user: "1001:1001"
    environment:
      NODE_ENV: ${NODE_ENV}
      BACKEND_PORT: ${BACKEND_PORT}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS}
      AI_WORKER_URL: ${AI_WORKER_URL}
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD}
      WORK_START: ${WORK_START}
      WORK_END: ${WORK_END}
      LATE_GRACE_MINUTES: ${LATE_GRACE_MINUTES}
      EARLY_LEAVE_GRACE_MINUTES: ${EARLY_LEAVE_GRACE_MINUTES}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - hrm_backend
      - hrm_frontend
    depends_on:
      db:
        condition: service_healthy
      ai-worker:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  # --------------------------------------------------------------------------
  # Frontend (Nginx serving static files)
  # --------------------------------------------------------------------------
  frontend:
    image: nginx:1.27-alpine
    container_name: attendance_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx-frontend.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - hrm_frontend
    depends_on:
      - backend
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M

  # --------------------------------------------------------------------------
  # Reverse proxy (Nginx with TLS + security headers)
  # --------------------------------------------------------------------------
  proxy:
    image: nginx:1.27-alpine
    container_name: attendance_proxy
    restart: unless-stopped
    volumes:
      - ./nginx/nginx-proxy.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - hrm_frontend
      - hrm_backend
    depends_on:
      - backend
      - frontend
      - phpmyadmin
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M


networks:
  hrm_frontend:
    driver: bridge
    name: attendance_frontend_net
  hrm_backend:
    driver: bridge
    name: attendance_backend_net

volumes:
  db_data:
    name: attendance_db_data
  ai_uploads:
    name: attendance_ai_uploads
  backend_uploads:
    name: attendance_backend_uploads
